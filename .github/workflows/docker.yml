name: Docker

on:
  pull_request:
    paths:
      - "projects/07_fastapi_titanic_api/**"
      - "templates/fastapi_ml/**"
      - "templates/streamlit_rag/**"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Titanic API image
        run: docker build -f projects/07_fastapi_titanic_api/Dockerfile -t titanic-api .

      - name: Build generic ML template image
        run: docker build -f templates/fastapi_ml/Dockerfile -t ml-api .

      - name: Build RAG chat image
        run: docker build -f templates/streamlit_rag/Dockerfile -t rag-chat .

      - name: Smoke-test Titanic API container
        run: |
          docker run -d -p 8000:8000 --name smoke titanic-api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"pclass":1,"sex":"female","age":29,"sibsp":0,"fare":100,"embarked":"S"}'
          docker rm -f smoke
