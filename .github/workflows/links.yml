name: Links

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links with lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,403,429
            --timeout 20
            --max-retries 2
            --exclude '^https://img\.shields\.io'
            README.md docs/*.md CONTRIBUTING.md
          fail: true
